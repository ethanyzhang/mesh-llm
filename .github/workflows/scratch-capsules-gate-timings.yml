# Scratch only, on a fork branch: time each capsules plugin gate at the
# Mesh-LLM/mesh-llm#2459 head on a GitHub-hosted Linux x64 runner. Not for merge.
name: Scratch · capsules gate timings
on:
  push:
    branches: [scratch/capsules-gate-timings]
permissions:
  contents: read
jobs:
  timings:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
        with:
          components: clippy
      - uses: taiki-e/install-action@3d23c1bbdafe696dfccad2664945a04f47d03dc3 # just
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config libssl-dev libdbus-1-dev curl mold lld
      - name: Runner
        run: |
          set -euo pipefail
          { echo "## Runner"; echo; echo "- $(nproc) CPUs, $(free -g | awk '/Mem:/{print $2}') GiB RAM, $(lsb_release -ds)"; echo "- $(rustc -V)"; echo "- head $(git rev-parse HEAD)"; echo; echo "| Step | Seconds | Result |"; echo "| --- | --- | --- |"; } >> "$GITHUB_STEP_SUMMARY"
      - name: "Warm-up: Clippy of the plugin (CI runs the gates after it)"
        run: |
          set -uo pipefail
          start=$(date +%s); cargo clippy --locked -p mesh-llm-capsules-plugin --all-targets -- -D warnings; rc=$?
          echo "| clippy -p mesh-llm-capsules-plugin --all-targets (warm-up) | $(( $(date +%s) - start )) | $rc |" >> "$GITHUB_STEP_SUMMARY"
      - name: Gates
        run: |
          set -uo pipefail
          failed=0
          for gate in mutants referee-mutants unbounded-depth no-keys vectors web-ui package-twice; do
            start=$(date +%s); just plugin-capsules-gate "$gate"; rc=$?
            echo "| just plugin-capsules-gate $gate | $(( $(date +%s) - start )) | $rc |" >> "$GITHUB_STEP_SUMMARY"
            [ "$rc" -eq 0 ] || failed=1
          done
          exit "$failed"
